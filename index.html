<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Room to Grow</title>
<style>
:root{--ink:#5b4242;--pink:#ff8fa3;--purple:#8f7ad6;--cream:#fff8ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,sans-serif;color:var(--ink)}
body{background:
 radial-gradient(circle at 50% 100%,transparent 14px,rgba(255,255,255,.13) 15px,rgba(255,255,255,.13) 17px,transparent 18px) 0 0/36px 18px,
 linear-gradient(#8ec0ff,#b9d6ff)}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* ---------- chunky UI ---------- */
.pill{background:#f3ecff;border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(80,60,140,.25);font-weight:800;padding:6px 12px;display:flex;align-items:center;gap:6px}
.btn{font-weight:900;font-size:20px;padding:14px 26px;border-radius:22px;background:linear-gradient(#ff8b8b,#e85d6a);color:#fff;border:3px solid #fff;box-shadow:0 6px 0 #b8414f,0 10px 18px rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8414f}
.btn.green{background:linear-gradient(#8fe0a0,#4fbf6b);box-shadow:0 6px 0 #34914c,0 10px 18px rgba(0,0,0,.18)}
.btn.purple{background:linear-gradient(#b9a6ff,#8b72e8);box-shadow:0 6px 0 #6650c0,0 10px 18px rgba(0,0,0,.18)}
.btn.small{font-size:16px;padding:10px 18px;border-radius:16px}
.icon-btn{width:50px;height:50px;border-radius:16px;background:#f3ecff;border:3px solid #fff;box-shadow:0 4px 0 rgba(80,60,140,.3);display:grid;place-items:center}
/* Soft miniature visual polish */
body{background:radial-gradient(ellipse at 50% 38%,#d7ecff 0%,#a8ccf5 57%,#9fb9ec 100%)}
#stage{filter:drop-shadow(0 13px 17px rgba(86,76,128,.12))}
.pill,.tool,.icon-btn{background:linear-gradient(145deg,#fffdfd,#f3e7ff);border-color:#fff;box-shadow:inset 0 2px 0 #fff,0 5px 0 #b5a0d1,0 8px 15px #7b78a52a}
.btn{background:linear-gradient(160deg,#ffb5bf 0%,#fa7f99 45%,#e86586 100%);border-color:#ffeaf3;box-shadow:inset 0 2px 0 #ffffff9e,0 6px 0 #b95a79,0 12px 22px #5f53753d}
.node{background:linear-gradient(155deg,#fffdfd,#e7ecff);box-shadow:inset 0 4px 0 #fff,0 8px 0 #8c91bd44,0 13px 22px #747b9b30}
.node.current{background:linear-gradient(155deg,#fff1f7,#ffc5da)}
/* ---------- home ---------- */
#home{align-items:center}
.home-top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 6px}
.logo{text-align:center;margin-top:4px}
.logo h1{margin:0;font-size:38px;font-weight:900;color:#fff;letter-spacing:.5px;text-shadow:0 3px 0 #8b72e8,0 6px 0 rgba(0,0,0,.12)}
.logo p{margin:2px 0 0;color:#fff;font-weight:700;opacity:.9}
#path{flex:1;width:100%;max-width:460px;overflow-y:auto;position:relative;padding:10px 0 20px}
#path svg.trail{position:absolute;left:0;top:0;pointer-events:none}
.node{position:relative;width:118px;height:96px;margin:6px auto;display:grid;place-items:center;border-radius:50px;background:#eef3ff;border:3px dashed #fff;box-shadow:0 6px 0 rgba(70,90,160,.18);cursor:pointer;transition:transform .15s}
.node svg{width:64px;height:64px}
.node .num{position:absolute;left:12px;bottom:6px;font-weight:900;font-size:17px;color:#a4a9c8}
.node .stars{position:absolute;top:-12px;font-size:16px;letter-spacing:-1px}
.node.done{background:#fff}
.node.current{background:#ffd6e0;border-style:solid;box-shadow:0 0 0 6px rgba(255,255,255,.5),0 0 32px rgba(255,143,163,.9);animation:pulse 1.6s ease-in-out infinite}
.node.locked{filter:grayscale(1) opacity(.65);cursor:default}
.node .tag{position:absolute;top:-14px;background:#ff8fa3;color:#fff;font-weight:900;font-size:13px;padding:3px 10px;border-radius:10px;border:2px solid #fff}
@keyframes pulse{50%{transform:scale(1.06)}}
.home-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.home-bottom .row{display:flex;gap:14px}
/* ---------- game ---------- */
#game header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 0;gap:8px}
.lvl{font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #6f8fd8}
.lvl small{display:block;font-size:13px;opacity:.9}
.timer{flex:1;max-width:200px;text-align:center}
.timer .t{font-weight:900;font-size:28px;color:#fff;text-shadow:0 3px 0 #6f8fd8}
.bar{height:16px;border-radius:10px;background:#7a5ea8;border:3px solid #fff;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#a6f0a0,#4fbf6b);border-radius:6px;transition:width .3s}
.timer.frozen .t{color:#d8f3ff;text-shadow:0 3px 0 #4aa3d8}
.timer.low .t{color:#ffd0d0;animation:shake .4s infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#stage{flex:1;width:100%;min-height:0;touch-action:none;display:block}
.toolbar{display:flex;justify-content:center;gap:14px;padding:6px 0 calc(14px + env(safe-area-inset-bottom))}
.tool{position:relative;width:64px;height:64px;border-radius:18px;background:#f3ecff;border:3px solid #fff;box-shadow:0 5px 0 rgba(80,60,140,.3);display:grid;place-items:center}
.tool:active{transform:translateY(3px)}
.tool.active{background:#fff6b0;box-shadow:0 0 0 4px rgba(255,240,150,.7),0 5px 0 rgba(80,60,140,.3)}
.tool svg{width:40px;height:40px}
.tool .badge{position:absolute;right:-8px;bottom:-8px;min-width:26px;height:26px;border-radius:10px;background:#e85d6a;color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.tool .badge.cost{background:#ffcf4d;color:var(--ink)}
.item{cursor:grab}
.item.dragging{cursor:grabbing}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px) rotate(2deg)}}
.hintpulse{animation:hp .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes hp{to{transform:scale(1.18)}}
.boxwiggle{animation:wig .5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* ---------- modal ---------- */
.modal{position:absolute;inset:0;background:rgba(60,40,90,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.card{background:var(--cream);border:4px solid #fff;border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.12),0 20px 40px rgba(0,0,0,.25);width:100%;max-width:360px;padding:22px 20px 20px;text-align:center;position:relative;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 4px;font-size:28px;font-weight:900}
.card .age{display:inline-block;background:#ffd6e0;border-radius:10px;padding:2px 10px;font-weight:800;font-size:14px}
.card p{font-size:16px;line-height:1.45;margin:10px 4px 14px}
.card .btns{display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-top:6px}
.bigstars{font-size:44px;letter-spacing:4px;margin:6px 0}
.bigstars span{display:inline-block;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) backwards}
.bigstars .off{filter:grayscale(1) opacity(.35)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.reward{font-weight:900;font-size:18px}
.confetti{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;pointer-events:none;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ---------- memories ---------- */
#memories header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}
#memories h2{margin:0;color:#fff;font-size:28px;font-weight:900;text-shadow:0 3px 0 #8b72e8}
#memlist{flex:1;overflow-y:auto;padding:6px 16px 30px;display:flex;flex-direction:column;gap:16px;align-items:center}
.mem{background:var(--cream);border:4px solid #fff;border-radius:24px;padding:12px;width:100%;max-width:380px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.mem svg{width:100%;border-radius:16px;background:#cfe2ff;display:block}
.mem h3{margin:10px 4px 2px;font-size:20px}
.mem p{margin:4px;line-height:1.4}
.mem.locked{opacity:.6;text-align:center;padding:30px 12px}
.toast{position:absolute;left:50%;top:auto;bottom:130px;transform:translateX(-50%);background:#fff;padding:10px 18px;border-radius:16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:80%}
.toast.on{opacity:1}

.lvlwrap{display:flex;flex-direction:column;gap:4px;min-width:110px}
.lvl small{font-size:12px}
.starpill{padding:2px 10px;font-size:15px;align-self:flex-start;border-radius:12px}
.starpill.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
#game{position:absolute}
.ghost{pointer-events:none;transition:opacity .2s}
.ghost.hot{opacity:.5}
.btn.blue{background:linear-gradient(#8fd0ff,#4a9be8);box-shadow:0 6px 0 #2f74b8,0 10px 18px rgba(0,0,0,.18)}
.banner{display:inline-block;margin:-44px auto 10px;background:linear-gradient(#c9b6ff,#9a82ec);color:#fff;font-weight:900;font-size:26px;padding:8px 34px;border-radius:14px;border:3px solid #fff;text-shadow:0 2px 0 #6650c0;box-shadow:0 5px 0 #6650c0}
.prev{background:linear-gradient(#cfe0ff,#e6dcff);border-radius:18px;border:3px solid #fff;overflow:hidden}
.prev svg{display:block;width:100%}
.twobtn{display:flex;gap:12px;justify-content:center}.twobtn .btn{flex:1;padding:12px 0}
.fine{font-size:13px!important;opacity:.7;margin:10px 0 0!important}
.close{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:50%;background:#ff6f7f;color:#fff;font-weight:900;font-size:18px;border:3px solid #fff;box-shadow:0 3px 0 #b8414f}
#snow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background-image:radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:60px 60px,37px 37px;animation:snow 6s linear infinite;box-shadow:inset 0 0 60px rgba(190,235,255,.9)}
#snow.on{opacity:.9}
@keyframes snow{to{background-position:30px 600px,-20px 400px}}
.timer.frozen .bar i{background:linear-gradient(#d8f6ff,#7cc8f0)}
#stage .item polygon,#stage .item path,#stage .item rect{stroke-linejoin:round;stroke-linecap:round}
#stage .item{filter:drop-shadow(0 2px 2px rgba(75,51,77,.07))}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="home-top">
    <div class="pill"><svg width="24" height="24" viewBox="-12 -12 24 24"><circle r="10" fill="#ffcf4d" stroke="#5b4242" stroke-width="2"/><circle r="5.5" fill="none" stroke="#e8a92a" stroke-width="2"/></svg><span class="coins">0</span></div>
    <button class="icon-btn" id="homeSettings" aria-label="Settings"><svg width="28" height="28" viewBox="-12 -12 24 24"><path d="M-2-11h4l1 3 3 1.5 3-1.5 2.5 2.8-1.5 3 1 3 3 1v4l-3 1-1 3 1.5 3-2.8 2.5-3-1.5-3 1-1 3h-4l-1-3-3-1-3 1.5L-11.5 7l1.5-3-1-3-3-1v-4l3-1 1-3-1.5-3L-8.2-8.5l3 1.5 2-1z" transform="scale(.85)" fill="#b9a6ff" stroke="#5b4242" stroke-width="2" stroke-linejoin="round"/><circle r="3.5" fill="#fff" stroke="#5b4242" stroke-width="2"/></svg></button>
  </div>
  <div class="logo"><h1>Room to Grow</h1><p>unpack a life, one box at a time</p></div>
  <div id="path"></div>
  <div class="home-bottom">
    <button class="btn" id="playBtn" style="font-size:30px;padding:16px 64px">PLAY</button>
    <div class="row">
      <button class="btn purple small" id="memBtn">📖 Memories</button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <header>
    <div class="lvlwrap"><div class="lvl" id="lvlName">Level 1</div><div class="pill starpill" id="starPill">⭐ <span id="starCount">0</span></div></div>
    <div class="timer" id="timer"><div class="t" id="timeTxt">3:00</div><div class="bar"><i id="timeBar"></i></div></div>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2" fill="#b9a6ff" stroke="#5b4242" stroke-width="2"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#b9a6ff" stroke="#5b4242" stroke-width="2"/></svg></button>
  </header>
  <svg id="stage" viewBox="0 30 400 500" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="sil" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .33  0 0 0 0 .25  0 0 0 0 .45  0 0 0 .5 0"/></filter>
      <filter id="fshadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="4" flood-color="#3b2d6b" flood-opacity=".28"/></filter>
    </defs>
    <g id="roomL"></g><g id="ghostL"></g><g id="sceneL"></g><g id="boxL"></g><g id="floatL"></g><g id="fxL"></g>
  </svg>
  <div id="snow"></div>
  <div class="toolbar">
    <button class="tool" id="tHint" aria-label="Hint"><svg viewBox="-20 -20 40 40"><path d="M-6 8 C-14 2 -14 -14 0 -14 C14 -14 14 2 6 8Z" fill="#ffe27a" stroke="#5b4242" stroke-width="2.4" stroke-linejoin="round"/><rect x="-6" y="8" width="12" height="7" rx="2" fill="#c9a27a" stroke="#5b4242" stroke-width="2.4"/><path d="M0 -19v-0 M-15 -12l-3-2 M15 -12l3-2" stroke="#ffcf4d" stroke-width="3" stroke-linecap="round"/></svg><span class="badge" id="bHint"></span></button>
    <button class="tool" id="tAuto" aria-label="Auto place"><svg viewBox="-20 -20 40 40"><circle cx="-3" cy="-3" r="10" fill="#e9e2ff" stroke="#5b4242" stroke-width="2.4"/><circle cx="-6" cy="-6" r="3" fill="#fff"/><path d="M5 5 L14 14" stroke="#c77dde" stroke-width="6" stroke-linecap="round"/></svg><span class="badge" id="bAuto"></span></button>
    <button class="tool" id="tFreeze" aria-label="Freeze timer"><svg viewBox="-20 -20 40 40"><circle r="14" fill="#bfe9ff" stroke="#5b4242" stroke-width="2.4"/><path d="M0 -8 V0 H6" stroke="#4a8fd8" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-14 6 l5 -2 M14 6 l-5 -2 M-6 -14 l2 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><span class="badge" id="bFreeze"></span></button>
  </div>
</section>

<!-- MEMORIES -->
<section id="memories" class="screen">
  <header><button class="icon-btn" id="memBack" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#5b4242" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Memories</h2></header>
  <div id="memlist"></div>
</section>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>

<script>
const star=(x,y,s=1,c='#fff6b0')=>`<path transform="translate(${x},${y}) scale(${s})" d="M0 -6 l1.8 3.8 4.2 .5 -3.1 2.9 .8 4.2 -3.7 -2.1 -3.7 2.1 .8 -4.2 -3.1 -2.9 4.2 -.5z" fill="${c}"/>`;
const S='stroke="#5b4242" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"';
const SL='stroke="#5b4242" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"';
const A={
pillow:()=>`<rect x="-25" y="-11" width="50" height="22" rx="10" fill="#fff4e6" ${S}/><path d="M-12 -1 q12 5 24 0" fill="none" stroke="#e9cdb8" stroke-width="2" stroke-linecap="round"/>`,
teddy:()=>`<circle cx="-11" cy="-17" r="6" fill="#c98f5e" ${S}/><circle cx="11" cy="-17" r="6" fill="#c98f5e" ${S}/><ellipse cx="0" cy="9" rx="14" ry="12" fill="#c98f5e" ${S}/><circle cx="0" cy="-8" r="12" fill="#d39a68" ${S}/><ellipse cx="0" cy="-4" rx="5.5" ry="4" fill="#f3d6b6"/><circle cx="-4.5" cy="-10" r="1.7" fill="#5b4242"/><circle cx="4.5" cy="-10" r="1.7" fill="#5b4242"/><ellipse cx="0" cy="-5.5" rx="1.9" ry="1.4" fill="#5b4242"/><path d="M0 4 L-7 1 L-7 8Z M0 4 L7 1 L7 8Z" fill="#ff8fa3" ${SL}/>`,
lamp:(c='#ffd27a')=>`<path d="M-14 -20 L14 -20 L20 2 L-20 2Z" fill="${c}" ${S}/><rect x="-2.5" y="2" width="5" height="14" fill="#c9a27a" ${S}/><ellipse cx="0" cy="17" rx="11" ry="3.5" fill="#c9a27a" ${S}/>`,
clock:()=>`<circle cx="-8" cy="-11" r="4" fill="#ffd27a" ${S}/><circle cx="8" cy="-11" r="4" fill="#ffd27a" ${S}/><path d="M-7 10 l-3 4 M7 10 l3 4" fill="none" ${S}/><circle r="12" fill="#ff9aa8" ${S}/><circle r="8.5" fill="#fff"/><path d="M0 0 V-5 M0 0 H4" fill="none" ${SL}/>`,
books:()=>`<rect x="-17" y="-13" width="10" height="28" rx="1.5" fill="#8ab6f9" ${S}/><rect x="-7" y="-9" width="9" height="24" rx="1.5" fill="#9ad8a7" ${S}/><rect x="2" y="-15" width="10" height="30" rx="1.5" fill="#ff9aa8" ${S}/><path d="M12 15 L21 -9 L27 -6 L18 15Z" fill="#ffd27a" ${S}/>`,
trophy:()=>`<path d="M-10 -10 h-5 a5 5 0 0 0 5 7 M10 -10 h5 a5 5 0 0 1 -5 7" fill="none" ${S}/><path d="M-10 -14 H10 V-4 A10 10 0 0 1 -10 -4Z" fill="#ffcf4d" ${S}/><rect x="-2.5" y="5" width="5" height="5" fill="#ffcf4d" ${S}/><rect x="-9" y="10" width="18" height="5" rx="1" fill="#c9a27a" ${S}/><path d="M0 -12 l1.5 3 3 .4 -2.2 2 .6 3 -2.9-1.5 -2.9 1.5 .6-3 -2.2-2 3-.4z" fill="#fff6c9"/>`,
drawing:()=>`<rect x="-25" y="-19" width="50" height="38" rx="3" fill="#c9a27a" ${S}/><rect x="-20" y="-14" width="40" height="28" fill="#fffdf6"/><circle cx="13" cy="-8" r="4.5" fill="#ffd27a"/><path d="M-15 10 V0 L-8 -6 L-1 0 V10Z" fill="#ff9aa8" ${SL}/><circle cx="8" cy="-1" r="2.2" fill="none" stroke="#6aa6f0" stroke-width="1.5"/><path d="M8 1.2 V6 M5 3 H11 M8 6 l-3 4 M8 6 l3 4" stroke="#6aa6f0" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M-20 12 q20 -4 40 0" stroke="#7fcf8f" stroke-width="2" fill="none"/>`,
plant:(pot='#f4a77a')=>`<path d="M0 0 C-14 -4 -16 -16 -8 -20 C-4 -12 -2 -8 0 0Z" fill="#7fcf8f" ${S}/><path d="M0 0 C14 -4 16 -16 8 -20 C4 -12 2 -8 0 0Z" fill="#6bbf7d" ${S}/><path d="M0 0 C-3 -10 0 -18 2 -22 C5 -14 4 -6 0 0Z" fill="#8fdc9c" ${S}/><path d="M-10 0 H10 L7 14 H-7Z" fill="${pot}" ${S}/>`,
flower:()=>`<path d="M0 0 V-14" stroke="#6bbf7d" stroke-width="2.5"/><path d="M0 -6 q-8 -2 -9 -8 q7 0 9 6" fill="#7fcf8f" ${SL}/><g fill="#ff8fa3" ${SL}><circle cx="0" cy="-22" r="4.5"/><circle cx="-5" cy="-17" r="4.5"/><circle cx="5" cy="-17" r="4.5"/><circle cx="-3" cy="-12" r="4"/><circle cx="3" cy="-12" r="4"/></g><circle cx="0" cy="-16" r="3" fill="#ffd27a"/><path d="M-10 0 H10 L7 14 H-7Z" fill="#8ab6f9" ${S}/>`,

/* ===================== ISO ENGINE ===================== */
const U=28,CO=.866,SI=.5,W=8,D=7,H=5;
const OX=187.9,OY=196;
const P=(x,y,z=0)=>[OX+(x-y)*CO*U,OY+(x+y)*SI*U-z*U];
const pt=q=>{const p=P(q[0],q[1],q[2]||0);return p[0].toFixed(1)+','+p[1].toFixed(1)};
function shade(h,f){const n=parseInt(h.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return `rgb(${Math.min(255,r*f)|0},${Math.min(255,g*f)|0},${Math.min(255,b*f)|0})`}
const poly=(pts,fill,st='')=>`<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" ${st}/>`;
function cube(x,y,z,w,d,h,col,o={}){
  const st=`stroke="${o.s||shade(col,.62)}" stroke-width="${o.sw||1.1}" stroke-linejoin="round"`;
  const T=[[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]];
  const L=[[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]];
  const R=[[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]];
  return poly(L,o.l||shade(col,.9),st)+poly(R,o.r||shade(col,.76),st)+poly(T,o.t||col,st);
}
function cyl(x,y,z,r,h,col){
  const [cx,yb]=P(x,y,z),[,yt]=P(x,y,z+h);const rx=1.2247*r*U,ry=.7071*r*U;const st=`stroke="${shade(col,.62)}" stroke-width="1.1"`;
  return `<path d="M${cx-rx} ${yt} V${yb} A${rx} ${ry} 0 0 0 ${cx+rx} ${yb} V${yt}Z" fill="${shade(col,.78)}" ${st}/><ellipse cx="${cx}" cy="${yt}" rx="${rx}" ry="${ry}" fill="${col}" ${st}/>`;
}
const mtx=(a,b,c,d,p)=>`matrix(${a},${b},${c},${d},${p[0].toFixed(1)},${p[1].toFixed(1)})`;
const onWallR=(x,z,art,sc=1)=>`<g transform="${mtx(CO*sc,SI*sc,0,sc,P(x,.06,z))}">${art}</g>`; // plane y=0
const onWallL=(y,z,art,sc=1)=>`<g transform="${mtx(CO*sc,-SI*sc,0,sc,P(.06,y,z))}">${art}</g>`; // plane x=0
const onFaceY=(x,yp,z,art,sc=1)=>`<g transform="${mtx(CO*sc,SI*sc,0,sc,P(x,yp+.01,z))}">${art}</g>`;
const onFaceX=(xp,y,z,art,sc=1)=>`<g transform="${mtx(CO*sc,-SI*sc,0,sc,P(xp+.01,y,z))}">${art}</g>`;
const onFloor=(x,y,art,z=0)=>`<g transform="${mtx(CO,SI,-CO,SI,P(x,y,z))}">${art}</g>`; // 1 art unit = 1px along iso axes; U px = 1 cell
function sprite(x,y,z,art,sc=1,dy=0,shadow=true){
  const p=P(x,y,z);
  return (shadow?`<ellipse cx="${p[0].toFixed(1)}" cy="${(p[1]+1).toFixed(1)}" rx="${(15*sc).toFixed(1)}" ry="${(5*sc).toFixed(1)}" fill="#5b3a5a" opacity=".16"/>`:'')+
  `<g transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)}) scale(${sc}) translate(0,${-dy})">${art}</g>`;
}
function legs4(x,y,w,d,h,col,t=.14){const i=.06;return [[x+i,y+i],[x+w-t-i,y+i],[x+i,y+d-t-i],[x+w-t-i,y+d-t-i]].map(q=>cube(q[0],q[1],0,t,t,h,col)).join('')}
function table(x,y,w,d,h,col,leg){return legs4(x,y,w,d,h-.15,leg||shade2(col,.8))+cube(x,y,h-.15,w,d,.15,col)}
function shade2(h,f){const n=parseInt(h.slice(1),16);const c=[n>>16,n>>8&255,n&255].map(v=>Math.min(255,v*f|0));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function stool(x,y,col='#e8736b'){return cyl(x,y,0,.08,.78,'#a8743a')+cube(x-.3,y-.03,.15,.6,.06,.06,'#a8743a')+cube(x-.03,y-.3,.15,.06,.6,.06,'#a8743a')+cyl(x,y,.78,.42,.16,col)}
function planks(col){
  let s='';const lc=shade(col,.86);
  for(let y=.7;y<D;y+=.7){const a=P(0,y),b=P(W,y);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${lc}" stroke-width="1.2"/>`;
    for(let x=((y*10|0)%3)*.9+1.1;x<W;x+=2.6){const c=P(x,y-.7),e=P(x,y);s+=`<line x1="${c[0]}" y1="${c[1]}" x2="${e[0]}" y2="${e[1]}" stroke="${lc}" stroke-width="1.2"/>`}}
  return s;
}
function checker(a,b,sz=1){let s=`<rect width="${W*U}" height="${D*U}" fill="${a}"/>`;const c=U*sz;for(let i=0;i<W/sz;i++)for(let j=0;j<D/sz;j++)if((i+j)%2)s+=`<rect x="${i*c}" y="${j*c}" width="${c}" height="${c}" fill="${b}"/>`;return onFloor(0,0,s)}
function shell(o){
  const T=.35,top=o.top||'#e0806f';
  return cube(-T,-T,-.5,W+T,D+T,.5,o.floor,{l:shade(o.floor,.72),r:shade(o.floor,.6)})+

const rugR=(x,y,w,h,c)=>onFloor(x,y,`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${Math.min(w,h)*.14}" fill="${c}" stroke="${shade(c,.85)}" stroke-width="2"/><rect x="${-w/2+11}" y="${-h/2+11}" width="${w-22}" height="${h-22}" rx="6" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>`);
const rugC=(x,y,rx,ry,c)=>onFloor(x,y,`<ellipse rx="${rx}" ry="${ry}" fill="${c}" stroke="${shade(c,.85)}" stroke-width="2"/><ellipse rx="${rx-13}" ry="${ry-13}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 6"/>`);
function desk(x,y,w,d,h,col,dc){const lc=shade2(col,.8);return cube(x+.12,y+.1,0,.12,.12,h-.15,lc)+cube(x+.12,y+d-.24,0,.12,.12,h-.15,lc)+cube(x+w-1.2,y+.05,0,1.1,d-.12,h-.15,dc)+onFaceY(x+w-1.16,y+d-.07,h-.25,F.cabinets(29,(h-.32)*U,dc))+cube(x,y,h-.15,w,d,.15,col)}
function counter(x,y,w,d,h,base,top){return cube(x,y,0,w,d,h,base)+onFaceY(x+.04,y+d,h-.06,F.cabinets(w*U-6,(h-.18)*U,base))+cube(x-.05,y-.05,h,w+.1,d+.1,.14,top)}
function chair(x,y,col,back='yd',w=.9,sh=.8){const lc=shade2(col,.75);
  const b={yd:[x,y+w-.12,w,.12],y0:[x,y,w,.12],xd:[x+w-.12,y,.12,w],x0:[x,y,.12,w]}[back];
  const bk=cube(b[0],b[1],sh+.12,b[2],b[3],.85,col),seat=cube(x,y,sh,w,w,.12,col);
  return legs4(x,y,w,w,sh,lc,.1)+(back==='y0'||back==='x0'?bk+seat:seat+bk)}
function rtable(x,y,r,h,col){return cyl(x,y,0,r*.5,.07,col)+cyl(x,y,.07,.1,h-.17,shade2(col,.85))+cyl(x,y,h-.1,r,.1,col)}
function armchair(x,y,col){return cube(x,y,0,1.4,1.25,.55,col)+cube(x,y,.55,.28,1.25,.4,col)+cube(x+.28,y,.55,.84,1,.16,shade2(col,1.08))+cube(x+1.12,y,.55,.28,1.25,.4,col)+cube(x,y+.95,.55,1.4,.3,.85,col)}
function bed(x,y,w,d,frame,sheet,blanket,head){return (head?cube(x,y,0,.3,d,1.9,head):'')+cube(x+(head?.3:0),y,0,w,d,.55,frame)+cube(x+(head?.3:0),y,.55,w,d,.4,sheet)+cube(x+(head?.3:0)+w*.42,y-.03,.55,w*.6,d+.06,.46,blanket)}
function crib(x,y,w,d,c){const p=(a,b)=>cube(a,b,0,.13,.13,1.6,c);
  const bars=(n,len)=>{let s='';for(let i=1;i<n;i++)s+=`<path d="M${i*len/n} 0 V${.85*U}" stroke="${c}" stroke-width="3"/>`;return s};
  return p(x,y)+p(x+w-.13,y)+cube(x,y,1.45,w,.1,.12,c)+p(x,y+d-.13)+cube(x,y,1.45,.1,d,.12,c)+cube(x,y,.4,w,d,.2,c)+cube(x+.05,y+.05,.6,w-.1,d-.1,.22,'#fff7f0')+
   onFaceX(x+w-.06,y+d,1.45,bars(8,d*U))+onFaceY(x,y+d-.06,1.45,bars(12,w*U))+p(x+w-.13,y+d-.13)+cube(x,y+d-.1,1.45,w,.1,.12,c)+cube(x+w-.1,y,1.45,.1,d,.12,c)}
function rocker(x,y,col='#c9a27a'){const rk=xx=>{const a=P(xx,y-.45,.18),m=P(xx,y+.7,-.12),b=P(xx,y+1.85,.18);return `<path d="M${a[0]} ${a[1]} Q${m[0]} ${m[1]+8} ${b[0]} ${b[1]}" fill="none" stroke="${shade2(col,.65)}" stroke-width="5" stroke-linecap="round"/>`};
  const lg=shade2(col,.8);return rk(x+.1)+cube(x+.05,y+.05,.15,.12,.12,.8,lg)+cube(x+1.15,y+.05,.15,.12,.12,.8,lg)+cube(x+.05,y+1.2,.15,.12,.12,.8,lg)+cube(x,y,.9,.2,1.35,1.8,col)+cube(x,y,.9,1.3,1.35,.15,col)+cube(x+1.15,y+1.2,.15,.12,.12,.8,lg)+rk(x+1.22)}
function piano(x,y,c){return cube(x+.1,y+.9,0,.15,.15,1.0,c)+cube(x,y,0,2.6,.9,2.1,c)+cube(x,y+.9,.95,2.6,.55,.14,c)+onFloor(x+.06,y+.96,`<rect x="0" y="0" width="${2.48*U}" height="${.42*U}" fill="#fff"/>${Array.from({length:17},(_,i)=>`<path d="M${(i+1)*2.48*U/18} 0 V${.42*U}" stroke="#c9c2d9" stroke-width="1"/>`).join('')}${[1,2,4,5,6,8,9,11,12,13,15,16].map(i=>`<rect x="${i*2.48*U/18-1.6}" y="0" width="3.2" height="${.24*U}" fill="#3d3a4b"/>`).join('')}`,1.09)+cube(x+2.35,y+.9,0,.15,.15,1.0,c)}
function fireplace(x,y,w,d,h,stone){return cube(x,y,0,w,d,h,stone)+onFaceY(x+.25,y+d,h-.35,F.fire((w-.5)*U,(h-.35)*U))+cube(x-.2,y-.05,h,w+.4,d+.2,.18,'#8a5a2c')}

function tone(f,d=.12,type='sine',v=.15,delay=0,slide){

function tween(dur,fn,done,ease=t=>1-Math.pow(1-t,3)){const t0=performance.now();function f(now){let t=Math.min(1,(now-t0)/dur);fn(ease(t));if(t<1)requestAnimationFrame(f);else done&&done()}requestAnimationFrame(f)}
const backOut=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

let G=null;
const BOX={x:200,y:482};

function startLevel(i,relax){
  const L=LEVELS[i];
  G={i,L,relax,items:[],time:L.time,left:L.time,paused:false,frozen:0,over:false,drag:null,count:0};
  $('roomL').innerHTML=L.room();
  ['ghostL','sceneL','floatL','fxL','boxL'].forEach(id=>$(id).innerHTML='');
  $('lvlName').innerHTML=`Level ${i+1}<small>${L.name}</small>`;
  $('starCount').textContent='0';
  $('timer').style.visibility=relax?'hidden':'visible';
  show('game');
  L.items.forEach((d,idx)=>{
    const it={d,idx,state:'box',dx:0,dy:0,s:.3};
    buildItem(it);G.items.push(it);
  });
  // queue: base furniture first, roughly; shuffle within groups
  const base=G.items.filter(t=>!t.d.dep).sort(()=>Math.random()-.5);
  const deps=G.items.filter(t=>t.d.dep).sort(()=>Math.random()-.5);
  G.queue=[...base,...deps];
  const bg=mk('g',{transform:`translate(${BOX.x},${BOX.y})`});bg.style.cursor='pointer';
  const bi=mk('g',{class:'boxwiggle'},box(false));bg.appendChild(mk('rect',{x:-45,y:-60,width:90,height:80,fill:'transparent'}));bg.appendChild(bi);$('boxL').appendChild(bg);
  G.boxEl=bi;G.boxG=bg;
  bg.addEventListener('pointerdown',e=>{e.stopPropagation();popOne(true)});
  refreshTools();renderTimer();
  clearInterval(G.tick);G.last=performance.now();G.tick=setInterval(loop,200);
  setTimeout(()=>{if(G&&!G.over){popOne();setTimeout(()=>G&&popOne(),350)}},700);
  if(i===0&&!save.stars[0])setTimeout(()=>toast('Drag each item to where it belongs! Stuck? Tap 💡 to reveal shadows.'),1500);
}
function buildItem(it){
  const outer=mk('g',{class:'item'}),inner=mk('g',{class:'bob'}),art=mk('g',{},it.d.art());
  inner.style.animationDelay=(-Math.random()*2.6)+'s';
  inner.appendChild(art);outer.appendChild(inner);
  $('floatL').appendChild(outer);
  const bb=art.getBBox();
  it.cx=bb.x+bb.width/2;it.cy=bb.y+bb.height/2;it.bw=bb.width;it.bh=bb.height;
  const hw=Math.max(46,bb.width+8),hh=Math.max(46,bb.height+8);
  inner.insertBefore(mk('rect',{x:it.cx-hw/2,y:it.cy-hh/2,width:hw,height:hh,fill:'transparent'}),art);
  it.fs=Math.min(1,150/Math.max(bb.width,bb.height));
  if(it.el)it.el.replaceWith(outer);
  it.el=outer;it.inner=inner;it.art=art;
  outer.addEventListener('pointerdown',e=>grab(e,it));
  if(it.state==='box')outer.style.display='none';
  setT(it);
}
function setT(it){it.el.setAttribute('transform',`translate(${(it.cx+it.dx).toFixed(1)},${(it.cy+it.dy).toFixed(1)}) scale(${it.s.toFixed(3)}) translate(${(-it.cx).toFixed(1)},${(-it.cy).toFixed(1)})`)}
const isPlaced=id=>G.items.some(t=>t.d.id===id&&t.state==='placed');

function floatSpot(it){
  const floats=G.items.filter(t=>t.state==='float'&&t!==it).map(t=>[t.cx+t.dx,t.cy+t.dy]);
  let best=null,bs=-1;
  for(let k=0;k<40;k++){
    const hw=Math.min(it.bw*it.fs/2,150),hh=Math.min(it.bh*it.fs/2,120);const x=Math.max(8+hw,Math.min(392-hw,40+Math.random()*320)),y=Math.max(45+hh,Math.min(440,70+Math.random()*360));
    let sc=Math.min(...floats.map(f=>Math.hypot(f[0]-x,f[1]-y)),999);
    const dt=Math.hypot(x-it.cx,y-it.cy);if(dt<80)sc-=200;
    if(Math.hypot(x-BOX.x,y-BOX.y)<60)sc-=200;
    if(sc>bs){bs=sc;best=[x,y]}
  }
  return best;
}
function popOne(user){
  if(!G||G.over||G.paused)return;
  const k=G.queue.findIndex(t=>!t.d.dep||isPlaced(t.d.dep));
  if(k<0){if(user)toast(G.queue.length?'Place the furniture first!':'The box is empty!');return}
  const floatsN=G.items.filter(t=>t.state==='float').length;
  if(user&&floatsN>=5){toast('Place some items first!');return}
  const it=G.queue.splice(k,1)[0];
  it.state='float';it.el.style.display='';it.el.setAttribute('filter','url(#fshadow)');
  $('floatL').appendChild(it.el);
  showGhosts();
  G.boxEl.innerHTML=box(true);G.boxEl.classList.remove('boxwiggle');
  clearTimeout(G.boxT);G.boxT=setTimeout(()=>{if(G&&G.queue.length){G.boxEl.innerHTML=box(false);G.boxEl.classList.add('boxwiggle')}},700);
  const [tx,ty]=floatSpot(it);const sx=BOX.x,sy=BOX.y-30;
  sfx.pop();
  tween(560,t=>{const x=sx+(tx-sx)*t,y=sy+(ty-sy)*t-Math.sin(t*Math.PI)*60;it.dx=x-it.cx;it.dy=y-it.cy;it.s=.3+(it.fs-.3)*t;setT(it)},null,t=>t);
  if(!G.queue.length)setTimeout(()=>{if(G&&G.boxG)tween(400,t=>G.boxG.setAttribute('transform',`translate(${BOX.x},${BOX.y}) scale(${1-t})`),()=>G&&G.boxG&&G.boxG.remove())},600);
}
function showGhosts(){
  $('ghostL').innerHTML='';G.items.forEach(t=>t.ghost=null);
  if(!G.hintOn)return;
  const kinds=new Set(G.items.filter(t=>t.state==='float').map(t=>t.d.kind||t.d.id));
  G.items.filter(t=>t.state!=='placed'&&kinds.has(t.d.kind||t.d.id)).sort((a,b)=>a.d.depth-b.d.depth).forEach(t=>{
    const g=mk('g',{class:'ghost',filter:'url(#sil)'},t.d.art());g.dataset.id=t.d.id;$('ghostL').appendChild(g);t.ghost=g;
  });
}

function svgPt(e){const sv=$('stage');const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())}
function grab(e,it){
  if(!G||G.over||G.paused||it.state!=='float'||G.drag)return;
  e.preventDefault();e.stopPropagation();
  const p=svgPt(e);
  G.drag={it,ox:it.cx+it.dx-p.x,oy:it.cy+it.dy-p.y,id:e.pointerId};
  try{$('stage').setPointerCapture(e.pointerId)}catch(_){}
  it.inner.classList.remove('bob','hintpulse');$('floatL').appendChild(it.el);
  clearHint();sfx.pick();
  const s0=it.s;tween(140,t=>{it.s=s0+(1-s0)*t;setT(it)});
}
function nearestTarget(it){
  const k=it.d.kind||it.d.id;let best=null,bd=1e9;const x=it.cx+it.dx,y=it.cy+it.dy;
  for(const t of G.items){if(t.state==='placed'||(t.d.kind||t.d.id)!==k)continue;const d=Math.hypot(t.cx-x,t.cy-y);if(d<bd){bd=d;best=t}}
  return [best,bd];
}
$('stage').addEventListener('pointermove',e=>{
  if(!G||!G.drag||e.pointerId!==G.drag.id)return;
  const p=svgPt(e),it=G.drag.it;
  it.dx=p.x+G.drag.ox-it.cx;it.dy=p.y+G.drag.oy-it.cy;setT(it);
  const [t,d]=nearestTarget(it);
  G.items.forEach(o=>o.ghost&&o.ghost.classList.toggle('hot',o===t&&d<40));
});
function endDrag(e){
  if(!G||!G.drag||e.pointerId!==G.drag.id)return;
  const it=G.drag.it;G.drag=null;
  const [t,d]=nearestTarget(it);
  if(t&&d<40&&!G.over){
    if(t!==it){ // identical items: swap identities
      const sx=it.cx+it.dx,sy=it.cy+it.dy,ss=it.s;
      const tmp=it.d;it.d=t.d;t.d=tmp;const tst=t.state;
      buildItem(it);it.dx=sx-it.cx;it.dy=sy-it.cy;it.s=ss;setT(it);
      const tx=t.cx+t.dx,ty=t.cy+t.dy;buildItem(t);t.dx=tx-t.cx;t.dy=ty-t.cy;setT(t);
      if(tst==='float'){t.el.style.display='';t.el.setAttribute('filter','url(#fshadow)')}
    }
    place(it);
  }else{
    sfx.drop();
    const x=Math.max(10,Math.min(390,it.cx+it.dx)),y=Math.max(40,Math.min(520,it.cy+it.dy));
    const fx=it.dx,fy=it.dy,fs=it.s;
    tween(220,t2=>{it.dx=fx+(x-it.cx-fx)*t2;it.dy=fy+(y-it.cy-fy)*t2;it.s=fs+(it.fs-fs)*t2;setT(it)},()=>it.inner.classList.add('bob'));
    G.items.forEach(o=>o.ghost&&o.ghost.classList.remove('hot'));
  }
}
$('stage').addEventListener('pointerup',endDrag);
$('stage').addEventListener('pointercancel',endDrag);

function place(it,auto){
  it.state='placed';it.inner.classList.remove('bob','hintpulse');it.el.style.pointerEvents='none';it.el.removeAttribute('filter');
  const fx=it.dx,fy=it.dy,fs=it.s;
  const finish=()=>{
    const layer=$('sceneL');let before=null;
    for(const n of layer.children){if(+n.dataset.depth>it.d.depth){before=n;break}}
    it.el.dataset.depth=it.d.depth;layer.insertBefore(it.el,before);
    tween(280,t=>{it.dx=fx*(1-Math.min(1,t*1.5));it.dy=fy*(1-Math.min(1,t*1.5));it.s=fs+(1-fs)*t;setT(it)},()=>{it.dx=0;it.dy=0;it.s=1;setT(it)},backOut);
    sfx.place();sparkle(it.cx,it.cy);
    G.count+=1;$('starCount').textContent=G.count;starPop(it.cx,it.cy-20);
    showGhosts();
    if(G.items.every(t=>t.state==='placed')){G.over=true;clearInterval(G.tick);setTimeout(win,800)}
    else if(!G.items.some(o=>o.state==='float'))setTimeout(()=>popOne(),450);
  };
  if(auto){tween(600,t=>{it.dx=fx*(1-t);it.dy=fy*(1-t)-Math.sin(t*Math.PI)*40;setT(it)},()=>{fx2();});function fx2(){it.dx=0;it.dy=0;finish()}}
  else finish();
}
function sparkle(x,y){
  const cols=['#fff6b0','#ffd27a','#ff8fa3','#fff','#b9a6ff'];
  for(let k=0;k<10;k++){const a=k/10*Math.PI*2+Math.random()*.4,dist=30+Math.random()*20;
    const s=mk('g',{},star(0,0,1,cols[k%cols.length]));$('fxL').appendChild(s);
    tween(650,t=>{s.setAttribute('transform',`translate(${x+Math.cos(a)*dist*t},${y+Math.sin(a)*dist*t}) scale(${1.4*(1-t)+.2})`);s.setAttribute('opacity',1-t)},()=>s.remove())}
  const ring=mk('circle',{cx:x,cy:y,r:5,fill:'none',stroke:'#fff','stroke-width':3});$('fxL').appendChild(ring);
  tween(450,t=>{ring.setAttribute('r',5+36*t);ring.setAttribute('opacity',1-t)},()=>ring.remove());
}
function starPop(x,y){const g=mk('g',{},star(0,0,2,'#ffcf4d'));$('fxL').appendChild(g);
  const r=$('starPill').getBoundingClientRect(),m=$('stage').getScreenCTM();const tx=(r.left+12-m.e)/m.a,ty=(r.top+12-m.f)/m.d;
  tween(700,t=>{g.setAttribute('transform',`translate(${x+(tx-x)*t},${y+(ty-y)*t-Math.sin(t*Math.PI)*30}) scale(${2-t})`)},()=>{g.remove();const p=$('starPill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')},t=>t*t)}

function loop(){
  if(!G||G.over)return;const now=performance.now(),dt=(now-G.last)/1000;G.last=now;
  if(G.paused||G.relax)return;
  if(G.frozen>0){G.frozen=Math.max(0,G.frozen-dt);$('snow').classList.toggle('on',G.frozen>0)}else G.left-=dt;
  renderTimer();
  if(G.left<=0){G.left=0;lose()}
}
function renderTimer(){
  $('timeTxt').textContent=fmt(G.left);
  $('timeBar').style.width=(G.left/G.time*100)+'%';
  $('timer').classList.toggle('frozen',G.frozen>0);$('timer').classList.toggle('low',G.left<20&&G.frozen<=0);
}
function starsFor(){if(G.relax)return 1;const f=G.left/G.time;return f>.45?3:f>.2?2:1}

/* ---------- boosters ---------- */
function useBooster(k){
  if(!G||G.over||G.paused)return;
  const floats=G.items.filter(t=>t.state==='float');
  if((k==='hint'||k==='auto')&&!floats.length){popOne(true);return}
  if(k==='freeze'&&(G.frozen>0||G.relax)){toast(G.relax?'No timer in Relax mode 🌙':'Already frozen!');return}
  if(save[k]>0)save[k]--;else if(save.coins>=COST[k])save.coins-=COST[k];else{toast(`Need ${COST[k]} coins`);return}
  persist();updateCoins();refreshTools();
  if(k==='hint'){
    clearHint();clearTimeout(G.hintT);G.hintOn=true;showGhosts();
    const it=floats[Math.floor(Math.random()*floats.length)];
    it.inner.classList.add('hintpulse');
    const [t]=nearestTarget(it);
    const ln=mk('path',{d:`M${it.cx+it.dx} ${it.cy+it.dy} L${t.cx} ${t.cy}`,stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 7','stroke-linecap':'round',fill:'none',opacity:.95});
    $('fxL').append(ln);if(t.ghost)t.ghost.classList.add('hintpulse');
    G.hint={it,t,ln,h:setTimeout(clearHint,3000)};tone(990,.2,'sine',.12);
    $('tHint').classList.add('active');
    G.hintT=setTimeout(()=>{if(!G)return;G.hintOn=false;showGhosts();$('tHint').classList.remove('active')},7000);
    toast('Shadows revealed for 7 seconds 💡');
  }
  if(k==='auto'){const it=floats[Math.floor(Math.random()*floats.length)];clearHint();$('floatL').appendChild(it.el);place(it,true)}
  if(k==='freeze'){G.frozen=15;$('snow').classList.add('on');renderTimer();tone(1400,.3,'sine',.08);tone(1800,.3,'sine',.06,.1);toast('Timer frozen for 15s ❄')}
}
function clearHint(){if(G&&G.hint){clearTimeout(G.hint.h);G.hint.ln.remove();G.hint.it.inner.classList.remove('hintpulse');if(G.hint.t.ghost)G.hint.t.ghost.classList.remove('hintpulse');G.hint=null}}
function refreshTools(){
  for(const k of ['hint','auto','freeze']){const b=$('b'+k[0].toUpperCase()+k.slice(1));
    if(save[k]>0){b.textContent=save[k];b.classList.remove('cost')}else{b.textContent='🪙'+COST[k];b.classList.add('cost')}}
}
$('tHint').onclick=()=>useBooster('hint');$('tAuto').onclick=()=>useBooster('auto');$('tFreeze').onclick=()=>useBooster('freeze');

/* ---------- modals ---------- */
function modal(html){$('card').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function confetti(){const c=['#ff8fa3','#ffd27a','#8ab6f9','#9ad8a7','#b9a6ff'];for(let k=0;k<70;k++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[k%5];d.style.animationDuration=(1.6+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
function miniRoom(L,cls=''){return `<svg class="${cls}" viewBox="0 40 400 380">${L.room()}${L.items.slice().sort((a,b)=>a.depth-b.depth).map(it=>it.art()).join('')}</svg>`}

function preLevel(i){
  const L=LEVELS[i];tone(700,.08,'triangle');
  modal(`<div class="banner">Level ${i+1}</div><div class="prev"><svg viewBox="0 40 400 380">${L.room()}</svg></div><h2 style="font-size:24px">${L.name}</h2><p style="margin:4px 4px 14px">${L.desc}</p>
  <div class="twobtn"><button class="btn green" id="mPlay">Play</button><button class="btn blue" id="mRelax">Relax</button></div>
  <p class="fine">Relax = no timer, no pressure 🌙</p><button class="close" id="mX">✕</button>`);
  $('mPlay').onclick=()=>{closeModal();startLevel(i,false)};
  $('mRelax').onclick=()=>{closeModal();startLevel(i,true)};
  $('mX').onclick=closeModal;
}
function win(){
  const st=starsFor(),i=G.i,prev=save.stars[i]||0;
  const reward=30+G.count*3+(G.relax?0:st*15);save.coins+=reward;save.stars[i]=Math.max(prev,st);
  if(save.unlocked<=i)save.unlocked=Math.min(LEVELS.length,i+1);
  if(st===3&&prev<3)save.hint++;if(!prev)save.hint++;
  persist();updateCoins();sfx.win();confetti();
  const L=G.L,last=i===LEVELS.length-1;
  modal(`<span class="age">${L.age}</span><h2>${L.name}</h2>
   <div class="bigstars">${G.relax?'<span>🌙</span>':[0,1,2].map(k=>`<span class="${k<st?'':'off'}" style="animation-delay:${.15+k*.18}s">⭐</span>`).join('')}</div>
   <p>“${L.story}”</p><div class="reward">+${reward} 🪙${(st===3&&prev<3?1:0)+(prev?0:1)?' · +'+((st===3&&prev<3?1:0)+(prev?0:1))+' 💡':''}</div>
   <div class="btns"><button class="btn green" id="mNext">${last?'The End 💛':'Next Room'}</button><button class="btn purple small" id="mHome">Home</button></div>`);
  $('mNext').onclick=()=>{closeModal();if(last){goHome();setTimeout(()=>{modal(`<h2>Room to Grow</h2><p>From a first teddy bear to tea in the sunroom — a whole life, unpacked one box at a time.</p><p>Every finished room is kept in <b>Memories</b>. Replay any level to chase ⭐⭐⭐!</p><div class="btns"><button class="btn green" id="mOk">Aww 🥹</button></div>`);$('mOk').onclick=closeModal},300)}else preLevel(i+1)};
  $('mHome').onclick=()=>{closeModal();goHome()};
}
function lose(){
  G.over=true;clearInterval(G.tick);sfx.lose();$('snow').classList.remove('on');
  modal(`<h2>Out of time!</h2><p>So close — only ${G.items.filter(t=>t.state!=='placed').length} things left to unpack.</p>
   <div class="btns"><button class="btn green" id="mMore">+60 seconds · 🪙60</button><button class="btn" id="mRetry">Try again</button><button class="btn purple small" id="mHome">Home</button></div>`);
  $('mMore').onclick=()=>{if(save.coins<60){toast('Not enough coins');return}save.coins-=60;persist();updateCoins();closeModal();G.left=60;G.over=false;G.last=performance.now();G.tick=setInterval(loop,200);renderTimer()};
  $('mRetry').onclick=()=>{closeModal();startLevel(G.i,G.relax)};
  $('mHome').onclick=()=>{closeModal();goHome()};
}
function pause(){
  if(!G||G.over)return;G.paused=true;
  modal(`<h2>Paused</h2><p>Take your time — the boxes will wait.</p><div class="btns"><button class="btn green" id="mRes">Resume</button><button class="btn" id="mRestart">Restart level</button><button class="btn purple small" id="mSnd">Sound: ${save.sound?'On 🔊':'Off 🔇'}</button><button class="btn purple small" id="mHome">Home</button></div>`);
  $('mRes').onclick=()=>{closeModal();G.paused=false;G.last=performance.now()};
  $('mRestart').onclick=()=>{closeModal();startLevel(G.i,G.relax)};
  $('mSnd').onclick=()=>{save.sound=!save.sound;persist();$('mSnd').textContent='Sound: '+(save.sound?'On 🔊':'Off 🔇')};
  $('mHome').onclick=()=>{closeModal();goHome()};
}
$('pauseBtn').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!G.paused&&$('game').classList.contains('on'))pause()});

/* ===================== HOME ===================== */
function goHome(){if(G){clearInterval(G.tick);G.over=true}G=null;$('snow').classList.remove('on');renderHome();show('home')}
function renderHome(){
  updateCoins();
  const p=$('path');p.innerHTML='';
  const cur=Math.min(save.unlocked,LEVELS.length-1);
  const soon=document.createElement('div');soon.className='node locked';soon.innerHTML=`<span style="font-weight:900;font-size:13px;text-align:center">More rooms<br>soon ✨</span>`;p.appendChild(soon);
  for(let i=LEVELS.length-1;i>=0;i--){
    const L=LEVELS[i],n=document.createElement('div');
    const done=save.stars[i]>0,locked=i>save.unlocked;
    n.className='node'+(done?' done':'')+(i===cur&&!locked?' current':'')+(locked?' locked':'');
    n.innerHTML=`${done?`<span class="stars">${'⭐'.repeat(save.stars[i])}</span>`:i===cur?`<span class="tag">${L.age}</span>`:''}<svg viewBox="-30 -30 60 60">${ICON[L.hero]()}</svg><span class="num">${i+1}</span>`;
    n.style.transform=`translateX(${[0,-60,0,60][i%4]}px)`;
    if(!locked)n.onclick=()=>preLevel(i);
    p.appendChild(n);
  }
  requestAnimationFrame(()=>{const c=p.querySelector('.current');if(c)c.scrollIntoView({block:'center'});else p.scrollTop=p.scrollHeight});
  $('playBtn').textContent=save.unlocked>=LEVELS.length?'REPLAY':'PLAY';
}
$('playBtn').onclick=()=>preLevel(save.unlocked>=LEVELS.length?0:save.unlocked);
$('homeSettings').onclick=()=>{
  modal(`<h2>Settings</h2><div class="btns"><button class="btn purple small" id="sSnd">Sound: ${save.sound?'On 🔊':'Off 🔇'}</button><button class="btn small" id="sReset">Reset progress</button><button class="btn green" id="sOk">Done</button></div>`);
  $('sSnd').onclick=()=>{save.sound=!save.sound;persist();$('sSnd').textContent='Sound: '+(save.sound?'On 🔊':'Off 🔇')};
  $('sReset').onclick=()=>{const b=$('sReset');if(b.dataset.c){save=Object.assign({},DEF,{stars:{}});persist();closeModal();renderHome();toast('Progress reset')}else{b.dataset.c=1;b.textContent='Tap again to confirm'}};
  $('sOk').onclick=closeModal;
};
$('memBtn').onclick=()=>{
  const list=$('memlist');list.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const d=document.createElement('div');
    if(save.stars[i]){d.className='mem';d.innerHTML=`${miniRoom(L)}<h3>${L.age} · ${L.name}</h3><p>${L.story}</p>`}
    else{d.className='mem locked';d.innerHTML=`<h3>🔒 ${L.age}</h3><p>Unpack this room to unlock its memory.</p>`}
    list.appendChild(d);
  });
  show('memories');
};
$('memBack').onclick=goHome;
document.addEventListener('gesturestart',e=>e.preventDefault());
renderHome();

</script>
</body>
</html>
